name: Build CV PDF & Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Liberation fonts for Arial metric compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Build HTML and ATS-friendly PDF
        run: npm run build

      - name: Upload PDF workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/*.pdf

      - name: Publish latest PDF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PDF_FILE="dist/CV_Moh_Novil_Maarij.pdf"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$PDF_FILE" --clobber
          else
            gh release create latest "$PDF_FILE" \
              --title "Latest CV" \
              --notes "Automatically generated ATS-friendly PDF resume from data/cv.json."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
